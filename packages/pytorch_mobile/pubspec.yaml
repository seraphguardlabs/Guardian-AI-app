name: pytorch_mobile
description: A Flutter plugin for running PyTorch models on mobile devices - Fixed for Flutter 3.x
version: 0.2.3
homepage: https://github.com/seraphguardlabs/pytorch_mobile

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.fynn.pytorch_mobile
        pluginClass: PyTorchMobilePlugin
